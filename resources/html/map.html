<!DOCTYPE html>
<html>
<head>
    <title>ArmoryGIS Map</title>
    <meta charset="utf-8">
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #1e1e1e; }
        #map { width: 100vw; height: 100vh; }
        #debug {
            position: fixed;
            right: 10px;
            bottom: 10px;
            z-index: 9999;
            background: rgba(8, 18, 36, 0.88);
            color: #8be9ff;
            border: 1px solid #2e4b74;
            border-radius: 8px;
            padding: 8px 10px;
            font: 12px/1.4 "Consolas", monospace;
            min-width: 260px;
            box-shadow: 0 0 0 1px rgba(70, 120, 180, 0.25);
        }
        #debug .k { color: #9fbef5; }
        #debug .v { color: #d5f5ff; }
        :root {
            --accent: #58d8ff;
            --danger: #ff6b6b;
            --warn: #ffc857;
        }
        .map-neon-glass {
            background: rgba(6, 10, 20, 0.38);
            border: 1px solid rgba(0, 255, 255, 0.38);
            border-radius: 10px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow:
                0 0 18px rgba(0, 255, 255, 0.14),
                inset 0 0 28px rgba(0, 200, 255, 0.07);
        }
        .sim-transfer-legend {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 9998;
            padding: 12px 14px;
            font-size: clamp(10px, 0.7rem + 0.35vw, 12px);
            max-width: min(340px, 42vw);
            pointer-events: none;
            color: rgba(185, 245, 255, 0.92);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.35);
        }
        .sim-transfer-legend h3 {
            margin: 0 0 10px;
            font-size: clamp(11px, 0.72rem + 0.3vw, 13px);
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #6dffff;
            text-shadow:
                0 0 10px rgba(0, 255, 255, 0.85),
                0 0 24px rgba(0, 200, 255, 0.45);
        }
        .sim-transfer-legend li span {
            filter: drop-shadow(0 0 4px currentColor);
        }
        .sim-transfer-legend.hidden {
            display: none !important;
        }
        .sim-transfer-legend li.hidden {
            display: none !important;
        }
        .leaflet-marker-icon.armory-azimuth-label {
            border: none !important;
            background: transparent !important;
        }
        .armory-azimuth-label span {
            display: inline-block;
            font-size: clamp(9px, 0.68rem + 0.25vw, 12px);
            font-weight: 700;
            color: rgba(230, 255, 255, 0.95);
            text-shadow:
                0 0 6px rgba(0, 0, 0, 0.95),
                0 0 10px rgba(0, 40, 60, 0.9);
            letter-spacing: 0.02em;
            pointer-events: none;
        }
        #mapCtxMenu {
            display: none;
            position: fixed;
            z-index: 20000;
            min-width: 200px;
            max-width: min(92vw, 320px);
            padding: 6px 0;
            background: rgba(10, 16, 28, 0.96);
            border: 1px solid rgba(0, 220, 255, 0.45);
            border-radius: 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
            font: 13px system-ui, "Segoe UI", sans-serif;
            color: #e5fbff;
        }
        #mapCtxMenu .map-ctx-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px 16px;
            border: none;
            background: transparent;
            color: inherit;
            cursor: pointer;
            font: inherit;
        }
        #mapCtxMenu .map-ctx-btn:hover,
        #mapCtxMenu .map-ctx-btn:focus {
            background: rgba(0, 220, 255, 0.15);
            outline: none;
        }
        #mapCtxMenu .map-ctx-preview {
            padding: 0 16px 10px;
            font-size: 11px;
            font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
            opacity: 0.82;
            word-break: break-all;
            line-height: 1.35;
        }
        #transferInfoPanel {
            position: fixed;
            left: 12px;
            bottom: 12px;
            z-index: 9997;
            max-width: min(440px, 94vw);
            max-height: min(52vh, 420px);
            overflow: auto;
            padding: 12px 14px;
            font-size: 12px;
            line-height: 1.45;
            color: rgba(210, 248, 255, 0.95);
            pointer-events: auto;
        }
        #transferInfoPanel.hidden {
            display: none !important;
        }
        #transferInfoTitle {
            margin: 0 0 10px;
            font-size: clamp(11px, 0.75rem + 0.25vw, 13px);
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #7dffff;
            text-shadow: 0 0 12px rgba(0, 220, 255, 0.55);
        }
        #transferInfoPanel table {
            width: 100%;
            border-collapse: collapse;
        }
        #transferInfoPanel th {
            text-align: left;
            vertical-align: top;
            padding: 4px 10px 4px 0;
            font-weight: 600;
            color: rgba(160, 220, 235, 0.92);
            white-space: nowrap;
            width: 42%;
        }
        #transferInfoPanel td {
            padding: 4px 0;
            word-break: break-word;
            font-family: ui-sans-serif, system-ui, sans-serif;
        }
        #transferInfoPanel td#transferTargetPlace {
            font-size: 11px;
            line-height: 1.4;
        }
        #transferInfoPanel[dir="rtl"] th {
            text-align: right;
            padding: 4px 0 4px 10px;
        }
        #transferInfoPanel[dir="rtl"] td {
            text-align: right;
        }
        #simTransferLegend[dir="rtl"] ul {
            padding-right: 16px;
            padding-left: 0;
        }
        html.main-map-rtl #transferInfoTitle {
            letter-spacing: 0.06em;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="simTransferLegend" class="sim-transfer-legend map-neon-glass hidden" aria-live="polite">
        <h3 id="mainMapLegendTitle">Legend</h3>
        <ul style="margin:0;padding-left:16px;">
            <li><span style="color:var(--danger)">●</span> <span id="mainMapLegendLaunch">Launch / range</span></li>
            <li><span style="color:var(--warn)">●</span> <span id="mainMapLegendTarget">Target</span></li>
            <li><span style="color:var(--accent)">—</span> <span id="mainMapLegendPath">Path</span></li>
            <li id="simLegDefense" class="hidden"><span style="color:#5dffc8">○</span> <span id="mainMapLegendDefense">Defense</span></li>
            <li id="simLegMeasure" class="hidden"><span style="color:#ffe566">—</span> <span id="mainMapLegendMeasure">Measure</span></li>
        </ul>
    </div>
    <div id="transferInfoPanel" class="transfer-info-panel map-neon-glass hidden" aria-live="polite">
        <h3 id="transferInfoTitle">Transfer scenario</h3>
        <table>
            <tbody id="transferInfoBody"></tbody>
        </table>
    </div>
    <div id="debug">
        <div><span class="k">Map:</span> <span id="dbg_map" class="v">booting</span></div>
        <div><span class="k">Bridge:</span> <span id="dbg_bridge" class="v">connecting</span></div>
        <div><span class="k">Last:</span> <span id="dbg_last" class="v">-</span></div>
    </div>
    <script>
        var map = null;
        var markers = null;
        var rings = null;
        var pyController;
        var _leafletReady = false;
        var _fallbackMode = false;
        var _initGuardTimer = null;
        var _fallbackState = { centerLat: 31.5, centerLon: 34.8, zoom: 6 };
        var _fallbackSvg = null;
        var _fallbackBasemap = "dark";
        var _fallbackTileLayer = null;
        function _set(id, txt) {
            const el = document.getElementById(id);
            if (el) el.textContent = txt;
        }
        function setDebugStatus(text) {
            _set("dbg_last", text);
            console.log("[MapStatus] " + text);
        }
        _set("dbg_map", "booting");

        // Initialize QWebChannel safely.
        if (typeof qt !== "undefined" && typeof QWebChannel !== "undefined") {
            new QWebChannel(qt.webChannelTransport, function(channel) {
                pyController = channel.objects.pyController;
                _offlineTilesEnabled = !!(pyController && pyController.get_tile_data_uri);
                _set("dbg_bridge", "connected");
                setDebugStatus("QWebChannel connected");
                if (_offlineTilesEnabled && map && tileLayer) {
                    setBasemap(_currentBasemap || "dark");
                }
            });
        } else {
            _set("dbg_bridge", "missing");
            setDebugStatus("QWebChannel unavailable");
        }

        var basemaps = {
            dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
            osm: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            topo: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
            satellite: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
        };
        var tileLayer = null;
        var _originMarker = null;
        var _targetMarker = null;
        var _activeRangeKm = null;
        var _activeWeaponName = null;
        var _activeEffects = null;
        var _rangeAzimuthEnabled = false;
        var _lastDrawRangeRingArgs = null;
        var _lastDrawWeaponEffectsArgs = null;
        var _offlineTilesEnabled = false;
        var _currentBasemap = "dark";
        var compareLayer = null;
        var _compareMode = false;
        var _comparePlaceMode = false;
        var _compareWeaponGroups = {};
        var MISSING_TILE =
            "data:image/svg+xml," +
            encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256">' +
                    '<rect width="256" height="256" fill="#1a2030"/>' +
                    '<path d="M0 0 L256 256 M256 0 L0 256" stroke="#2e3648" stroke-width="1"/>' +
                "</svg>"
            );
        try {
            _rangeAzimuthEnabled = localStorage.getItem("armorygis_map_range_azimuth_v1") === "1";
        } catch (e1) {}

        function canUseOfflineTiles() {
            return !!(_offlineTilesEnabled && pyController && pyController.get_tile_data_uri);
        }

        function createCachedTileLayer(basemapKey) {
            var basemap = basemapKey || "dark";
            var OfflineLayer = L.GridLayer.extend({
                createTile: function (coords, done) {
                    var tile = document.createElement("img");
                    tile.alt = "";
                    tile.setAttribute("role", "presentation");
                    tile.width = 256;
                    tile.height = 256;
                    if (!canUseOfflineTiles()) {
                        tile.src = MISSING_TILE;
                        done(null, tile);
                        return tile;
                    }
                    pyController.get_tile_data_uri(basemap, coords.z, coords.x, coords.y, function (uri) {
                        tile.src = uri || MISSING_TILE;
                        done(null, tile);
                    });
                    return tile;
                },
            });
            return new OfflineLayer({
                attribution: "&copy; Offline cache",
                maxZoom: 19,
                tileSize: 256,
            });
        }

        function ensureCompareLayer() {
            if (!map || compareLayer) return;
            compareLayer = L.layerGroup().addTo(map);
        }

        function setCompareMode(on) {
            _compareMode = !!on;
            if (_compareMode) ensureCompareLayer();
        }

        function setComparePlaceMode(on) {
            _comparePlaceMode = !!on;
            setDebugStatus(_comparePlaceMode ? "Compare place mode: click map" : "Compare place mode off");
        }

        function clearCompareWeapons() {
            _compareWeaponGroups = {};
            if (compareLayer) compareLayer.clearLayers();
        }

        function _compareWeaponIcon(color) {
            return L.divIcon({
                className: "compare-weapon-pin",
                html:
                    '<div style="width:18px;height:18px;border-radius:50%;background:' +
                    (color || "#00d4ff") +
                    ';border:2px solid #fff;box-shadow:0 0 8px rgba(0,0,0,.45);"></div>',
                iconSize: [18, 18],
                iconAnchor: [9, 9],
            });
        }

        function _bindCompareDrag(marker, minRing, maxRing, weaponId) {
            marker.on("drag", function (evt) {
                var p = evt.target.getLatLng();
                if (minRing) minRing.setLatLng(p);
                if (maxRing) maxRing.setLatLng(p);
            });
            marker.on("dragend", function (evt) {
                var p = evt.target.getLatLng();
                if (pyController && pyController.report_compare_weapon_moved) {
                    pyController.report_compare_weapon_moved(weaponId, p.lat, p.lng);
                }
                setDebugStatus("Compare weapon " + weaponId + " moved");
            });
            marker.on("click", function () {
                if (pyController && pyController.report_compare_weapon_focus) {
                    pyController.report_compare_weapon_focus(weaponId);
                }
            });
        }

        function _addCompareWeaponGraphic(w) {
            var lat = Number(w.lat);
            var lon = Number(w.lon);
            var maxKm = Number(w.range_km || 0);
            var minKm = Number(
                w.min_range_km != null ? w.min_range_km : Math.max(maxKm * 0.35, 0)
            );
            var color = w.color || "#00d4ff";
            var name = w.name || "Weapon";
            var wid = Number(w.id);
            var group = L.layerGroup();
            var origin = [lat, lon];
            var minRing = L.circle(origin, {
                radius: Math.max(500, minKm * 1000),
                color: "#7dd3fc",
                weight: 1.5,
                dashArray: "4 8",
                fillColor: "#7dd3fc",
                fillOpacity: 0.04,
            });
            var maxRing = L.circle(origin, {
                radius: Math.max(800, maxKm * 1000),
                color: color,
                weight: 2,
                dashArray: "8 8",
                fillColor: color,
                fillOpacity: 0.1,
            });
            group.addLayer(minRing);
            group.addLayer(maxRing);
            var marker = L.marker(origin, {
                draggable: true,
                icon: _compareWeaponIcon(color),
                zIndexOffset: 1000 + Number(w.layer_order || 0),
            });
            marker.bindPopup(
                "<b>" + name + "</b><br/>Max: " + maxKm.toFixed(0) + " km<br/>Min: " + minKm.toFixed(0) + " km<br/><i>Drag to move</i>"
            );
            _bindCompareDrag(marker, minRing, maxRing, wid);
            group.addLayer(marker);
            group.addTo(compareLayer);
            _compareWeaponGroups[wid] = group;
            return group;
        }

        function setCompareWeapons(list) {
            if (!map || !_leafletReady) return;
            ensureCompareLayer();
            clearCompareWeapons();
            if (!list || !list.length) return;
            var sorted = list.slice().sort(function (a, b) {
                return Number(a.layer_order || 0) - Number(b.layer_order || 0);
            });
            sorted.forEach(function (w) {
                _addCompareWeaponGraphic(w);
            });
            _reorderCompareLayers(sorted.map(function (w) { return Number(w.id); }));
            setDebugStatus("Compare: " + list.length + " weapon(s)");
        }

        function _reorderCompareLayers(idOrder) {
            if (!compareLayer || !idOrder) return;
            idOrder.forEach(function (id) {
                var g = _compareWeaponGroups[id];
                if (g && g.bringToFront) g.bringToFront();
            });
        }

        function bringCompareWeaponFront(weaponId) {
            var g = _compareWeaponGroups[weaponId];
            if (g && g.bringToFront) g.bringToFront();
        }

        function sendCompareWeaponBack(weaponId) {
            var g = _compareWeaponGroups[weaponId];
            if (!g || !compareLayer) return;
            if (g.bringToBack) g.bringToBack();
        }

        function fitCompareBounds() {
            if (!map || !compareLayer || !compareLayer.getLayers().length) return;
            try {
                map.fitBounds(compareLayer.getBounds(), { padding: [48, 48] });
            } catch (eFit) {}
        }

        window.__mainMapStrings = window.__mainMapStrings || {
            copyCoords: "Copy coordinates",
            legendTitle: "Legend",
            legLaunch: "Launch / range",
            legTarget: "Target",
            legPath: "Path",
            legDefense: "Defense",
            legMeasure: "Measure",
            nominatimLang: "en",
            rtl: false,
        };

        function applyMainMapLocaleStrings(s) {
            if (!s || typeof s !== "object") return;
            window.__mainMapStrings = Object.assign({}, window.__mainMapStrings, s);
            var m = window.__mainMapStrings;
            function setTxt(id, val) {
                if (val == null) return;
                var el = document.getElementById(id);
                if (el) el.textContent = val;
            }
            setTxt("mainMapLegendTitle", m.legendTitle);
            setTxt("mainMapLegendLaunch", m.legLaunch);
            setTxt("mainMapLegendTarget", m.legTarget);
            setTxt("mainMapLegendPath", m.legPath);
            setTxt("mainMapLegendDefense", m.legDefense);
            setTxt("mainMapLegendMeasure", m.legMeasure);
            var rtl = !!m.rtl;
            var leg = document.getElementById("simTransferLegend");
            if (leg) leg.setAttribute("dir", rtl ? "rtl" : "ltr");
            var panel = document.getElementById("transferInfoPanel");
            if (panel) panel.setAttribute("dir", rtl ? "rtl" : "ltr");
            if (document.documentElement) {
                document.documentElement.classList.toggle("main-map-rtl", rtl);
            }
        }

        function geoDestinationKm(latDeg, lonDeg, bearingDeg, distanceKm) {
            var R = 6371;
            var δ = distanceKm / R;
            var θ = (bearingDeg * Math.PI) / 180;
            var φ1 = (latDeg * Math.PI) / 180;
            var λ1 = (lonDeg * Math.PI) / 180;
            var sinφ1 = Math.sin(φ1);
            var cosφ1 = Math.cos(φ1);
            var sinδ = Math.sin(δ);
            var cosδ = Math.cos(δ);
            var sinθ = Math.sin(θ);
            var cosθ = Math.cos(θ);
            var φ2 = Math.asin(sinφ1 * cosδ + cosφ1 * sinδ * cosθ);
            var λ2 =
                λ1 + Math.atan2(sinθ * sinδ * cosφ1, cosδ - sinφ1 * Math.sin(φ2));
            var lon2 = (λ2 * 180) / Math.PI;
            lon2 = ((lon2 + 540) % 360) - 180;
            return [(φ2 * 180) / Math.PI, lon2];
        }

        function addAzimuthDecorations(layerGroup, centerLat, centerLon, radiusMeters, outlineColor) {
            var rKm = radiusMeters / 1000;
            if (!rKm || rKm <= 0) return;
            var step = 45;
            var tickKm = Math.min(Math.max(rKm * 0.035, 0.2), rKm * 0.12);
            var labelKm = Math.min(Math.max(rKm * 0.055, 0.35), rKm * 0.14);
            var col = outlineColor || "#ffffff";
            for (var b = 0; b < 360; b += step) {
                var outer = geoDestinationKm(centerLat, centerLon, b, rKm);
                var inner = geoDestinationKm(centerLat, centerLon, b, Math.max(0.001, rKm - tickKm));
                L.polyline([inner, outer], {
                    color: col,
                    weight: 2,
                    opacity: 0.9,
                    interactive: false,
                }).addTo(layerGroup);
                var lp = geoDestinationKm(centerLat, centerLon, b, rKm + labelKm);
                L.marker(lp, {
                    icon: L.divIcon({
                        className: "armory-azimuth-label",
                        html: '<span>' + b + "°</span>",
                        iconSize: [36, 18],
                        iconAnchor: [18, 9],
                    }),
                    interactive: false,
                    keyboard: false,
                }).addTo(layerGroup);
            }
        }

        function maybeAddRangeAzimuth(lat, lon, radiusMeters, outlineColor) {
            if (!_rangeAzimuthEnabled || !_leafletReady || _fallbackMode || !rings) return;
            var g = L.layerGroup();
            addAzimuthDecorations(g, lat, lon, radiusMeters, outlineColor);
            g.addTo(rings);
        }

        function setRangeRingAzimuthEnabled(on) {
            _rangeAzimuthEnabled = !!on;
            try {
                localStorage.setItem("armorygis_map_range_azimuth_v1", _rangeAzimuthEnabled ? "1" : "0");
            } catch (e2) {}
            redrawLastRangeGraphics();
        }

        function redrawLastRangeGraphics() {
            if (!_leafletReady || _fallbackMode) return;
            if (_lastDrawWeaponEffectsArgs && _lastDrawWeaponEffectsArgs.length) {
                drawWeaponEffects.apply(null, _lastDrawWeaponEffectsArgs);
            } else if (_lastDrawRangeRingArgs && _lastDrawRangeRingArgs.length) {
                drawRangeRing.apply(null, _lastDrawRangeRingArgs);
            }
        }

        var _mapCtxMenuEl = null;
        var _mapCtxMenuCloseBound = false;

        function hideMapContextMenu() {
            if (_mapCtxMenuEl) {
                _mapCtxMenuEl.style.display = "none";
            }
        }

        function copyCoordsToClipboard(text) {
            function fallback(t) {
                var ta = document.createElement("textarea");
                ta.value = t;
                ta.setAttribute("readonly", "");
                ta.style.position = "fixed";
                ta.style.left = "-10000px";
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand("copy");
                } catch (err) {}
                document.body.removeChild(ta);
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(function () {
                    fallback(text);
                });
            } else {
                fallback(text);
            }
        }

        function ensureMapContextMenu() {
            if (_mapCtxMenuEl) return _mapCtxMenuEl;
            _mapCtxMenuEl = document.createElement("div");
            _mapCtxMenuEl.id = "mapCtxMenu";
            _mapCtxMenuEl.setAttribute("role", "menu");
            document.body.appendChild(_mapCtxMenuEl);
            return _mapCtxMenuEl;
        }

        function showMapContextMenu(lat, lng, clientX, clientY) {
            var line = Number(lat).toFixed(6) + ", " + Number(lng).toFixed(6);
            var menu = ensureMapContextMenu();
            menu.innerHTML = "";
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "map-ctx-btn";
            btn.setAttribute("role", "menuitem");
            btn.textContent =
                (window.__mainMapStrings && window.__mainMapStrings.copyCoords) || "Copy coordinates";
            btn.onclick = function (e) {
                e.preventDefault();
                e.stopPropagation();
                copyCoordsToClipboard(line);
                setDebugStatus("Copied: " + line);
                hideMapContextMenu();
            };
            var preview = document.createElement("div");
            preview.className = "map-ctx-preview";
            preview.textContent = line;
            menu.appendChild(btn);
            menu.appendChild(preview);
            menu.style.display = "block";
            menu.style.visibility = "hidden";
            var mw = menu.offsetWidth;
            var mh = menu.offsetHeight;
            menu.style.visibility = "visible";
            var px = clientX;
            var py = clientY;
            if (px + mw > window.innerWidth - 8) px = Math.max(8, window.innerWidth - mw - 8);
            if (py + mh > window.innerHeight - 8) py = Math.max(8, window.innerHeight - mh - 8);
            menu.style.left = px + "px";
            menu.style.top = py + "px";

            if (!_mapCtxMenuCloseBound) {
                _mapCtxMenuCloseBound = true;
                document.addEventListener(
                    "click",
                    function (e) {
                        if (_mapCtxMenuEl && _mapCtxMenuEl.style.display !== "none" && !_mapCtxMenuEl.contains(e.target)) {
                            hideMapContextMenu();
                        }
                    },
                    true
                );
                document.addEventListener("keydown", function (e) {
                    if (e.key === "Escape") hideMapContextMenu();
                });
            }
            setTimeout(function () {
                btn.focus();
            }, 0);
        }

        function _weaponIcon() {
            const svg = `
            <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34">
              <defs>
                <radialGradient id="g" cx="50%" cy="40%" r="70%">
                  <stop offset="0%" stop-color="#b8f3ff"/>
                  <stop offset="55%" stop-color="#1ec8ff"/>
                  <stop offset="100%" stop-color="#0a5ea8"/>
                </radialGradient>
              </defs>
              <circle cx="17" cy="17" r="15" fill="#071628" stroke="#62d7ff" stroke-width="2"/>
              <path d="M10 21 L17 8 L24 21 L17 18 Z" fill="url(#g)" stroke="#d9f7ff" stroke-width="1"/>
              <circle cx="17" cy="17" r="3.2" fill="#ffd166"/>
            </svg>`;
            return L.divIcon({
                className: "weapon-origin-icon",
                html: svg,
                iconSize: [34, 34],
                iconAnchor: [17, 17],
                popupAnchor: [0, -14]
            });
        }

        function _targetIcon() {
            const svg = `
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30">
              <circle cx="15" cy="15" r="12" fill="#1b0d12" stroke="#ff8c8c" stroke-width="2"/>
              <circle cx="15" cy="15" r="7" fill="none" stroke="#ffd166" stroke-width="1.6"/>
              <line x1="15" y1="3" x2="15" y2="9" stroke="#ffd166" stroke-width="1.6"/>
              <line x1="15" y1="21" x2="15" y2="27" stroke="#ffd166" stroke-width="1.6"/>
              <line x1="3" y1="15" x2="9" y2="15" stroke="#ffd166" stroke-width="1.6"/>
              <line x1="21" y1="15" x2="27" y2="15" stroke="#ffd166" stroke-width="1.6"/>
              <circle cx="15" cy="15" r="2.2" fill="#ff5d5d"/>
            </svg>`;
            return L.divIcon({
                className: "weapon-target-icon",
                html: svg,
                iconSize: [30, 30],
                iconAnchor: [15, 15],
                popupAnchor: [0, -14]
            });
        }

        function _setTargetMarker(lat, lon) {
            if (_fallbackMode || !map) return;
            if (_targetMarker) {
                _targetMarker.setLatLng([lat, lon]);
                return;
            }
            _targetMarker = L.marker([lat, lon], { icon: _targetIcon() }).addTo(markers);
            _targetMarker.bindPopup("<b>Target</b>");
        }

        function _placeTargetPoint(lat, lon, statusLabel) {
            if (pyController && pyController.report_target_point) {
                pyController.report_target_point(lat, lon);
            }
            if (_fallbackMode) {
                _drawFallbackMarker(lat, lon, "#ffd166");
            } else {
                _setTargetMarker(lat, lon);
            }
            setDebugStatus(statusLabel || ("Target " + Number(lat).toFixed(3) + ", " + Number(lon).toFixed(3)));
        }

        function _setOriginMarker(lat, lon, weaponName) {
            if (_fallbackMode || !map) return;
            if (_originMarker) {
                _originMarker.setLatLng([lat, lon]);
                return;
            }
            _originMarker = L.marker([lat, lon], { icon: _weaponIcon(), draggable: true }).addTo(markers);
            _originMarker.bindPopup("<b>" + (weaponName || "Weapon") + "</b><br/>Drag to update location");
            _originMarker.on("dragend", function (evt) {
                const p = evt.target.getLatLng();
                if (pyController && pyController.report_weapon_origin) {
                    pyController.report_weapon_origin(p.lat, p.lng);
                }
                setDebugStatus("Weapon origin moved to " + p.lat.toFixed(4) + ", " + p.lng.toFixed(4));
            });
        }

        function ensureLeafletLoaded(onReady) {
            if (typeof L !== "undefined") {
                onReady(true);
                return;
            }
            const cssUrls = [
                "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css",
                "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css",
                "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
            ];
            const jsUrls = [
                "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js",
                "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js",
                "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"
            ];

            cssUrls.forEach((href) => {
                const link = document.createElement("link");
                link.rel = "stylesheet";
                link.href = href;
                document.head.appendChild(link);
            });

            let i = 0;
            function loadNext() {
                if (i >= jsUrls.length) {
                    onReady(false);
                    return;
                }
                const script = document.createElement("script");
                script.src = jsUrls[i++];
                script.onload = () => onReady(typeof L !== "undefined");
                script.onerror = loadNext;
                document.head.appendChild(script);
            }
            loadNext();
        }

        function initLeafletMap() {
            map = L.map("map", {
                center: [31.5, 34.8],
                zoom: 6,
                dragging: true,
                scrollWheelZoom: true,
                doubleClickZoom: true,
                boxZoom: true,
                keyboard: true,
                tap: true,
                zoomControl: false,
            });
            L.control.zoom({ position: "topright" }).addTo(map);
            markers = L.layerGroup().addTo(map);
            rings = L.layerGroup().addTo(map);
            tileLayer = L.tileLayer(basemaps.dark, { maxZoom: 19 }).addTo(map);
            _currentBasemap = "dark";
            if (canUseOfflineTiles()) {
                map.removeLayer(tileLayer);
                tileLayer = createCachedTileLayer("dark").addTo(map);
            }
            _leafletReady = true;
            _set("dbg_map", "ready");
            setDebugStatus("Leaflet initialized — drag to pan, wheel to zoom, right-click for target");

            map.on("click", function (evt) {
                if (_comparePlaceMode && pyController && pyController.report_compare_point) {
                    pyController.report_compare_point(evt.latlng.lat, evt.latlng.lng);
                    return;
                }
            });

            // Left click: pan only (Leaflet default). Right click: place target + context menu.
            map.on("contextmenu", function (evt) {
                evt.originalEvent.preventDefault();
                evt.originalEvent.stopPropagation();
                var ev = evt.originalEvent;
                _placeTargetPoint(
                    evt.latlng.lat,
                    evt.latlng.lng,
                    "Target (right-click) " + evt.latlng.lat.toFixed(3) + ", " + evt.latlng.lng.toFixed(3)
                );
                showMapContextMenu(evt.latlng.lat, evt.latlng.lng, ev.clientX, ev.clientY);
            });
            map.on("zoomstart movestart", hideMapContextMenu);
        }

        function _ensureFallbackSvg() {
            if (_fallbackSvg) return _fallbackSvg;
            const host = document.getElementById("map");
            host.innerHTML = "";
            host.style.background = "radial-gradient(circle at 30% 20%, #1f365e, #0a1220 55%, #04080f)";
            const svgNS = "http://www.w3.org/2000/svg";
            _fallbackSvg = document.createElementNS(svgNS, "svg");
            _fallbackSvg.setAttribute("width", "100%");
            _fallbackSvg.setAttribute("height", "100%");
            _fallbackSvg.style.display = "block";
            host.appendChild(_fallbackSvg);
            return _fallbackSvg;
        }

        function _fbScale() {
            return Math.max(6, _fallbackState.zoom * 6);
        }

        function _toFallbackPoint(lat, lon) {
            const host = document.getElementById("map");
            const w = host.clientWidth || 1200;
            const h = host.clientHeight || 800;
            const s = _fbScale();
            return {
                x: ((lon - _fallbackState.centerLon) * s) + (w / 2),
                y: ((_fallbackState.centerLat - lat) * s) + (h / 2),
            };
        }

        function _drawFallbackCircle(lat, lon, radiusPx, stroke, fill, dash) {
            const svg = _ensureFallbackSvg();
            const svgNS = "http://www.w3.org/2000/svg";
            const pt = _toFallbackPoint(lat, lon);
            const c = document.createElementNS(svgNS, "circle");
            c.setAttribute("cx", pt.x);
            c.setAttribute("cy", pt.y);
            c.setAttribute("r", radiusPx);
            c.setAttribute("stroke", stroke || "#00d4ff");
            c.setAttribute("stroke-width", "2");
            c.setAttribute("fill", fill || "rgba(0, 212, 255, 0.06)");
            if (dash) c.setAttribute("stroke-dasharray", dash);
            svg.appendChild(c);
        }

        function _drawFallbackMarker(lat, lon, color) {
            const svg = _ensureFallbackSvg();
            const svgNS = "http://www.w3.org/2000/svg";
            const pt = _toFallbackPoint(lat, lon);
            const c = document.createElementNS(svgNS, "circle");
            c.setAttribute("cx", pt.x);
            c.setAttribute("cy", pt.y);
            c.setAttribute("r", 6);
            c.setAttribute("fill", color || "#ffd166");
            c.setAttribute("stroke", "#ffffff");
            c.setAttribute("stroke-width", "1");
            svg.appendChild(c);
        }

        function _drawFallbackLine(lat1, lon1, lat2, lon2, color, dash) {
            const svg = _ensureFallbackSvg();
            const svgNS = "http://www.w3.org/2000/svg";
            const p1 = _toFallbackPoint(lat1, lon1);
            const p2 = _toFallbackPoint(lat2, lon2);
            const line = document.createElementNS(svgNS, "line");
            line.setAttribute("x1", p1.x);
            line.setAttribute("y1", p1.y);
            line.setAttribute("x2", p2.x);
            line.setAttribute("y2", p2.y);
            line.setAttribute("stroke", color || "#ffd166");
            line.setAttribute("stroke-width", "2");
            if (dash) line.setAttribute("stroke-dasharray", dash);
            svg.appendChild(line);
        }

        function _clearFallback() {
            const svg = _ensureFallbackSvg();
            while (svg.firstChild) svg.removeChild(svg.firstChild);
        }

        function _latLonToTileXY(lat, lon, zoom) {
            const n = Math.pow(2, zoom);
            const x = ((lon + 180.0) / 360.0) * n;
            const latRad = lat * Math.PI / 180.0;
            const y = (1 - Math.log(Math.tan(latRad) + (1 / Math.cos(latRad))) / Math.PI) / 2 * n;
            return { x: x, y: y };
        }

        function _renderFallbackTileBackground() {
            if (!pyController || !pyController.get_tile_data_uri) {
                setDebugStatus("Bridge not ready for cached tile rendering");
                return;
            }
            const svg = _ensureFallbackSvg();
            const host = document.getElementById("map");
            const w = host.clientWidth || 1200;
            const h = host.clientHeight || 800;
            const tileSize = 256;
            const tilesX = Math.max(3, Math.ceil(w / tileSize) + 2);
            const tilesY = Math.max(3, Math.ceil(h / tileSize) + 2);
            const center = _latLonToTileXY(_fallbackState.centerLat, _fallbackState.centerLon, _fallbackState.zoom);
            const centerPxX = center.x * tileSize;
            const centerPxY = center.y * tileSize;
            const startPxX = centerPxX - (w / 2);
            const startPxY = centerPxY - (h / 2);
            const startTileX = Math.floor(startPxX / tileSize);
            const startTileY = Math.floor(startPxY / tileSize);
            const offsetX = -(startPxX - (startTileX * tileSize));
            const offsetY = -(startPxY - (startTileY * tileSize));

            // Remove previous tile layer first.
            if (_fallbackTileLayer && _fallbackTileLayer.parentNode === svg) {
                svg.removeChild(_fallbackTileLayer);
            }
            const svgNS = "http://www.w3.org/2000/svg";
            _fallbackTileLayer = document.createElementNS(svgNS, "g");
            _fallbackTileLayer.setAttribute("data-role", "tiles");
            svg.appendChild(_fallbackTileLayer);

            for (let ix = 0; ix < tilesX; ix++) {
                for (let iy = 0; iy < tilesY; iy++) {
                    const tx = startTileX + ix;
                    const ty = startTileY + iy;
                    const x = Math.round(offsetX + ix * tileSize);
                    const y = Math.round(offsetY + iy * tileSize);
                    pyController.get_tile_data_uri(_fallbackBasemap, _fallbackState.zoom, tx, ty, function(uri) {
                        if (!uri) {
                            const rect = document.createElementNS(svgNS, "rect");
                            rect.setAttribute("x", x);
                            rect.setAttribute("y", y);
                            rect.setAttribute("width", tileSize);
                            rect.setAttribute("height", tileSize);
                            rect.setAttribute("fill", "#2d3138");
                            rect.setAttribute("stroke", "#4a5362");
                            rect.setAttribute("stroke-width", "1");
                            _fallbackTileLayer.appendChild(rect);
                            return;
                        }
                        const img = document.createElementNS(svgNS, "image");
                        img.setAttribute("x", x);
                        img.setAttribute("y", y);
                        img.setAttribute("width", tileSize);
                        img.setAttribute("height", tileSize);
                        img.setAttribute("href", uri);
                        _fallbackTileLayer.appendChild(img);
                    });
                }
            }
        }

        function initFallbackMap() {
            _fallbackMode = true;
            _leafletReady = true;
            _ensureFallbackSvg();
            _set("dbg_map", "fallback");
            setDebugStatus("Offline fallback map renderer active");
            _renderFallbackTileBackground();

            const host = document.getElementById("map");
            host.onwheel = function (evt) {
                evt.preventDefault();
                var delta = evt.deltaY || evt.wheelDelta || 0;
                if (delta < 0) {
                    _fallbackState.zoom = Math.min(18, (_fallbackState.zoom || 6) + 1);
                } else if (delta > 0) {
                    _fallbackState.zoom = Math.max(1, (_fallbackState.zoom || 6) - 1);
                }
                _renderFallbackTileBackground();
                setDebugStatus("Fallback wheel zoom: " + _fallbackState.zoom);
            };
            var _fbDrag = null;
            host.onmousedown = function (evt) {
                if (evt.button !== 0) return;
                _fbDrag = { x: evt.clientX, y: evt.clientY, lat: _fallbackState.centerLat, lon: _fallbackState.centerLon };
            };
            host.onmousemove = function (evt) {
                if (!_fbDrag) return;
                var rect = host.getBoundingClientRect();
                var s = _fbScale();
                var dx = evt.clientX - _fbDrag.x;
                var dy = evt.clientY - _fbDrag.y;
                _fallbackState.centerLon = _fbDrag.lon - dx / s;
                _fallbackState.centerLat = _fbDrag.lat + dy / s;
                _renderFallbackTileBackground();
            };
            host.onmouseup = function () {
                _fbDrag = null;
            };
            host.onmouseleave = function () {
                _fbDrag = null;
            };
            host.oncontextmenu = function (evt) {
                evt.preventDefault();
                const rect = host.getBoundingClientRect();
                const x = evt.clientX - rect.left;
                const y = evt.clientY - rect.top;
                const s = _fbScale();
                const lon = _fallbackState.centerLon + ((x - rect.width / 2) / s);
                const lat = _fallbackState.centerLat - ((y - rect.height / 2) / s);
                _placeTargetPoint(
                    lat,
                    lon,
                    "Fallback target (right-click) " + lat.toFixed(3) + ", " + lon.toFixed(3)
                );
                showMapContextMenu(lat, lon, evt.clientX, evt.clientY);
            };
        }

        ensureLeafletLoaded(function (ok) {
            if (_initGuardTimer) {
                clearTimeout(_initGuardTimer);
                _initGuardTimer = null;
            }
            if (!ok) {
                initFallbackMap();
                return;
            }
            initLeafletMap();
        });
        _initGuardTimer = setTimeout(function () {
            if (!_leafletReady) {
                initFallbackMap();
            }
        }, 4000);

        // Ask Python cache to warm tile requests when bridge is available.
        setTimeout(function () {
            if (pyController && pyController.request_tile) {
                pyController.request_tile('dark', 6, 32, 20);
            }
        }, 500);

        function addMarker(lat, lon, name, range) {
            if (!_leafletReady) return;
            if (_fallbackMode) {
                _drawFallbackMarker(lat, lon, "#00e5ff");
                _drawFallbackCircle(lat, lon, Math.max(12, range * 0.22), "#00e5ff", "rgba(0,229,255,0.08)");
                return;
            }
            var circle = L.circle([lat, lon], { radius: range * 1000, color: '#00ffcc', fillOpacity: 0.1 }).addTo(rings);
            _setOriginMarker(lat, lon, name);
        }

        function loadTileFromPath(x, y, z, path) {
            // Current implementation warms cache only.
            // Kept as hook for future custom tile source rendering.
        }

        function centerMap(lat, lon, zoom) {
            if (!_leafletReady) return;
            if (_fallbackMode) {
                _fallbackState.centerLat = lat;
                _fallbackState.centerLon = lon;
                _fallbackState.zoom = zoom || _fallbackState.zoom;
                _renderFallbackTileBackground();
                setDebugStatus("Fallback center updated");
                return;
            }
            map.setView([lat, lon], zoom || map.getZoom());
        }

        function setBasemap(name) {
            if (!_leafletReady) return;
            if (_fallbackMode) {
                _fallbackBasemap = name || _fallbackBasemap;
                _renderFallbackTileBackground();
                setDebugStatus("Fallback basemap: " + name);
                return;
            }
            if (!basemaps[name]) return;
            _currentBasemap = name;
            map.removeLayer(tileLayer);
            if (canUseOfflineTiles()) {
                tileLayer = createCachedTileLayer(name).addTo(map);
            } else {
                tileLayer = L.tileLayer(basemaps[name], { maxZoom: 19 }).addTo(map);
            }
            setDebugStatus("Basemap switched to " + name);
        }

        function zoomInMap() {
            if (!_leafletReady) return;
            if (_fallbackMode) {
                _fallbackState.zoom = Math.min(18, (_fallbackState.zoom || 6) + 1);
                _renderFallbackTileBackground();
                setDebugStatus("Fallback zoom in: " + _fallbackState.zoom);
                return;
            }
            map.zoomIn();
            setDebugStatus("Zoom in: " + map.getZoom());
        }

        function zoomOutMap() {
            if (!_leafletReady) return;
            if (_fallbackMode) {
                _fallbackState.zoom = Math.max(1, (_fallbackState.zoom || 6) - 1);
                _renderFallbackTileBackground();
                setDebugStatus("Fallback zoom out: " + _fallbackState.zoom);
                return;
            }
            map.zoomOut();
            setDebugStatus("Zoom out: " + map.getZoom());
        }

        function drawRangeRing(lat, lon, rangeKm, weaponName) {
            if (!_leafletReady) return;
            _activeRangeKm = rangeKm;
            _activeWeaponName = weaponName;
            _activeEffects = null;
            if (_fallbackMode) {
                _clearFallback();
                _renderFallbackTileBackground();
                _drawFallbackMarker(lat, lon, "#00d4ff");
                _drawFallbackCircle(lat, lon, Math.max(14, rangeKm * 0.24), "#00d4ff", "rgba(0,212,255,0.08)", "8 8");
                setDebugStatus("Fallback range ring drawn");
                return;
            }
            rings.clearLayers();
            markers.clearLayers();
            _originMarker = null;
            _targetMarker = null;
            var radius = (rangeKm || 0) * 1000;
            var ring = L.circle([lat, lon], {
                radius: radius,
                color: '#00ffcc',
                weight: 2,
                fillColor: '#00ffcc',
                fillOpacity: 0.12
            }).addTo(rings);
            maybeAddRangeAzimuth(lat, lon, radius, "#00ffcc");
            _lastDrawRangeRingArgs = [lat, lon, rangeKm, weaponName];
            _lastDrawWeaponEffectsArgs = null;
            _setOriginMarker(lat, lon, weaponName);
            var marker = _originMarker;
            marker.openPopup();
            map.fitBounds(ring.getBounds(), { padding: [20, 20] });
            setDebugStatus("Range ring drawn for " + weaponName);
        }

        function drawWeaponEffects(lat, lon, minRangeKm, maxRangeKm, blastRadiusM, weaponName, targetLat, targetLon) {
            if (!_leafletReady) return;
            _activeRangeKm = null;
            _activeWeaponName = weaponName;
            _activeEffects = {
                minRangeKm: minRangeKm,
                maxRangeKm: maxRangeKm,
                blastRadiusM: blastRadiusM,
                weaponName: weaponName,
                targetLat: targetLat,
                targetLon: targetLon
            };
            if (_fallbackMode) {
                _clearFallback();
                _renderFallbackTileBackground();
                _drawFallbackMarker(lat, lon, "#00d4ff");
                _drawFallbackCircle(lat, lon, Math.max(10, minRangeKm * 0.2), "#7dd3fc", "rgba(125,211,252,0.05)", "4 8");
                _drawFallbackCircle(lat, lon, Math.max(14, maxRangeKm * 0.24), "#00d4ff", "rgba(0,212,255,0.08)", "8 8");
                if (targetLat !== null && targetLon !== null) {
                    _drawFallbackMarker(targetLat, targetLon, "#ffd166");
                    _drawFallbackLine(lat, lon, targetLat, targetLon, "#ffd166", "6 6");
                    _drawFallbackCircle(targetLat, targetLon, Math.max(8, blastRadiusM * 0.004), "#ef4444", "rgba(239,68,68,0.12)", "3 5");
                }
                setDebugStatus("Fallback effects drawn");
                return;
            }
            rings.clearLayers();
            markers.clearLayers();
            _originMarker = null;
            _targetMarker = null;
            var origin = [lat, lon];
            var maxRing = L.circle(origin, {
                radius: maxRangeKm * 1000,
                color: '#00d4ff',
                weight: 2,
                dashArray: '8 8',
                fillOpacity: 0.05
            }).addTo(rings);
            var minRing = L.circle(origin, {
                radius: minRangeKm * 1000,
                color: '#7dd3fc',
                weight: 1.5,
                dashArray: '4 8',
                fillOpacity: 0.03
            }).addTo(rings);
            maybeAddRangeAzimuth(lat, lon, maxRangeKm * 1000, "#00d4ff");
            _lastDrawWeaponEffectsArgs = [
                lat,
                lon,
                minRangeKm,
                maxRangeKm,
                blastRadiusM,
                weaponName,
                targetLat,
                targetLon,
            ];
            _lastDrawRangeRingArgs = null;

            _setOriginMarker(lat, lon, weaponName);
            var originMarker = _originMarker;
            originMarker.bindPopup("<b>" + weaponName + "</b><br/>Drag to update location");
            originMarker.openPopup();

            if (targetLat !== null && targetLon !== null) {
                var target = [targetLat, targetLon];
                _targetMarker = L.marker(target, { icon: _targetIcon() }).addTo(markers).bindPopup("Target Point");
                L.polyline([origin, target], {
                    color: '#ffd166',
                    weight: 2,
                    dashArray: '6 6'
                }).addTo(rings);

                var cone = L.polygon([origin, [targetLat + 0.15, targetLon + 0.15], [targetLat - 0.15, targetLon - 0.15]], {
                    color: '#f97316',
                    fillColor: '#f97316',
                    fillOpacity: 0.12,
                    weight: 1.2
                }).addTo(rings);

                if (blastRadiusM > 0) {
                    L.circle(target, {
                        radius: blastRadiusM,
                        color: '#ef4444',
                        fillColor: '#ef4444',
                        fillOpacity: 0.15,
                        dashArray: '3 5',
                        weight: 2
                    }).addTo(rings);
                }
            }
            map.fitBounds(maxRing.getBounds(), { padding: [20, 20] });
            setDebugStatus("Effects drawn for " + weaponName);
        }

        function appendSimulatorTrajectory(latlngs) {
            if (!_leafletReady || !latlngs || latlngs.length < 2) return;
            if (_fallbackMode) return;
            try {
                var ll = latlngs.map(function (p) {
                    return [Number(p[0]), Number(p[1])];
                });
                L.polyline(ll, {
                    color: "#00fff2",
                    weight: 3,
                    opacity: 0.92,
                    dashArray: null,
                    lineJoin: "round",
                    lineCap: "round",
                }).addTo(rings);
                setDebugStatus("Simulator trajectory appended (" + ll.length + " pts)");
            } catch (e) {
                setDebugStatus("Trajectory append failed");
            }
        }

        function appendDefenseCircle(lat, lon, radiusM) {
            if (!_leafletReady || lat == null || lon == null) return;
            if (_fallbackMode) return;
            var r = Math.max(100, Number(radiusM) || 55000);
            L.circle([Number(lat), Number(lon)], {
                radius: r,
                color: "#5dffc8",
                weight: 2,
                fillColor: "#3ed4a8",
                fillOpacity: 0.08,
                opacity: 0.9,
                dashArray: "6 8",
            }).addTo(rings);
            setDebugStatus("Defense circle appended");
        }

        function appendSimulatorMeasure(points) {
            if (!_leafletReady || !points || points.length < 2) return;
            if (_fallbackMode) return;
            try {
                var ll = points.map(function (p) {
                    var lat = p.lat != null ? Number(p.lat) : Number(p[0]);
                    var lng = p.lng != null ? Number(p.lng) : Number(p[1]);
                    return [lat, lng];
                });
                L.polyline(ll, {
                    color: "#ffe566",
                    weight: 3,
                    opacity: 0.92,
                    dashArray: "8 5",
                    lineCap: "round",
                    lineJoin: "round",
                }).addTo(rings);
                setDebugStatus("Simulator measure line appended");
            } catch (e) {
                setDebugStatus("Measure append failed");
            }
        }

        function onExternalWeaponDrop(x, y) {
            if (!_leafletReady) return;
            if (_fallbackMode) {
                const host = document.getElementById("map");
                const rect = host.getBoundingClientRect();
                const s = _fbScale();
                const lon = _fallbackState.centerLon + ((x - rect.width / 2) / s);
                const lat = _fallbackState.centerLat - ((y - rect.height / 2) / s);
                if (pyController && pyController.report_target_point) {
                    pyController.report_target_point(lat, lon);
                }
                setDebugStatus("Fallback drop " + lat.toFixed(3) + ", " + lon.toFixed(3));
                return;
            }
            var point = map.containerPointToLatLng([x, y]);
            if (pyController && pyController.report_target_point) {
                pyController.report_target_point(point.lat, point.lng);
            }
            setDebugStatus("External weapon drop at " + point.lat.toFixed(3) + ", " + point.lng.toFixed(3));
        }

        function showSimTransferLegend(opts) {
            opts = opts || {};
            var leg = document.getElementById("simTransferLegend");
            if (!leg) return;
            var d = document.getElementById("simLegDefense");
            var m = document.getElementById("simLegMeasure");
            if (d) {
                d.classList.toggle("hidden", !opts.defense);
            }
            if (m) {
                m.classList.toggle("hidden", !opts.measure);
            }
            leg.classList.remove("hidden");
            setDebugStatus("Simulator legend visible");
        }

        function hideSimTransferLegend() {
            var leg = document.getElementById("simTransferLegend");
            if (leg) {
                leg.classList.add("hidden");
            }
        }

        function hideTransferInfoPanel() {
            var p = document.getElementById("transferInfoPanel");
            if (p) {
                p.classList.add("hidden");
            }
        }

        function fetchNominatimReverse(lat, lon) {
            var el = document.getElementById("transferTargetPlace");
            if (!el) return;
            el.textContent = "…";
            var url =
                "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" +
                encodeURIComponent(lat) +
                "&lon=" +
                encodeURIComponent(lon);
            var langPref =
                (window.__mainMapStrings && window.__mainMapStrings.nominatimLang) ||
                (typeof navigator !== "undefined" ? navigator.language || "en" : "en");
            fetch(url, {
                headers: {
                    Accept: "application/json",
                    "Accept-Language": langPref,
                },
            })
                .then(function (r) {
                    return r.json();
                })
                .then(function (j) {
                    if (el && j && j.display_name) {
                        el.textContent = j.display_name;
                    } else if (el) {
                        el.textContent = "—";
                    }
                })
                .catch(function () {
                    if (el) {
                        el.textContent = "—";
                    }
                });
        }

        function showTransferInfoPanel(payload) {
            if (!payload || typeof payload !== "object") {
                return;
            }
            var panel = document.getElementById("transferInfoPanel");
            var titleEl = document.getElementById("transferInfoTitle");
            var tbody = document.getElementById("transferInfoBody");
            if (!panel || !tbody || !titleEl) {
                return;
            }
            titleEl.textContent = payload.title || "";
            tbody.innerHTML = "";
            (payload.rows || []).forEach(function (row) {
                var tr = document.createElement("tr");
                var th = document.createElement("th");
                th.textContent = row.label || "";
                var td = document.createElement("td");
                if (row.isTargetName) {
                    td.id = "transferTargetPlace";
                }
                td.textContent = row.value != null ? row.value : "—";
                tr.appendChild(th);
                tr.appendChild(td);
                tbody.appendChild(tr);
            });
            panel.classList.remove("hidden");
            var rg = payload.reverseGeocode;
            if (
                rg &&
                rg.lat != null &&
                rg.lon != null &&
                Number.isFinite(Number(rg.lat)) &&
                Number.isFinite(Number(rg.lon))
            ) {
                fetchNominatimReverse(Number(rg.lat), Number(rg.lon));
            } else {
                var te = document.getElementById("transferTargetPlace");
                if (te) {
                    te.textContent = "—";
                }
            }
            setDebugStatus("Transfer scenario panel updated");
        }

        window.__armoryMapPing = function () {
            const hasFns =
                typeof centerMap === "function" &&
                typeof setBasemap === "function" &&
                typeof zoomInMap === "function" &&
                typeof zoomOutMap === "function" &&
                typeof drawRangeRing === "function" &&
                typeof drawWeaponEffects === "function";
            setDebugStatus("Ping: functions " + (hasFns ? "OK" : "MISSING"));
            return hasFns;
        };
    </script>
</body>
</html>

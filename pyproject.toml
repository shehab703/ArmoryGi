[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armorygis-pro"
version = "1.0.0"
description = "Weapons Database Management Desktop Application with Geospatial Intelligence and Offline Map Support"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary - Defense Use Only"}
authors = [
    {name = "Defense Systems Architecture Team", email = "dev@defensesystems.local"}
]
keywords = ["weapons", "database", "gis", "pyqt6", "defense", "offline-maps"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Defense Contractors",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Security",
]

dependencies = [
    "PyQt6>=6.4.0",
    "PyQt6-WebEngine>=6.4.0",
    "PyQt6-WebChannel>=6.4.0",
    "SQLAlchemy>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=0.8.11",
    "reportlab>=4.0.0",
    "requests>=2.31.0",
    "geopy>=2.4.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "pylint>=3.0.0",
]
postgres = ["psycopg2-binary>=2.9.0"]
packaging = ["pyinstaller>=5.13.0"]

[project.scripts]
armorygis = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["armorygis*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
armorygis = ["resources/**/*", "database/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --cov=armorygis --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | migrations
)/
'''